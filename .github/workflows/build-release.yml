name: Build and Release Patched wtfutil

on:
  push:
    branches:
      - main
      - master
      - trunk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.22'

      - name: Build wtfutil
        run: |
          GOTOOLCHAIN=auto go build -o wtf .

      - name: Get commit info
        id: commit
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "date=$(date -u +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Create release archive
        run: |
          mkdir -p wtf-patched-${{ steps.commit.outputs.sha_short }}
          cp wtf wtf-patched-${{ steps.commit.outputs.sha_short }}/
          cp README.md wtf-patched-${{ steps.commit.outputs.sha_short }}/
          tar -czf wtf-patched-${{ steps.commit.outputs.sha_short }}.tar.gz wtf-patched-${{ steps.commit.outputs.sha_short }}/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: wtf-patched-${{ steps.commit.outputs.sha_short }}.tar.gz
          tag_name: patched-${{ steps.commit.outputs.date }}-${{ steps.commit.outputs.sha_short }}
          body: |
            Patched wtfutil with OSC 8 hyperlink support
            Commit: ${{ steps.commit.outputs.sha_short }}
            Date: ${{ steps.commit.outputs.date }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
